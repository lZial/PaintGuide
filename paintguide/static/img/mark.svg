         Вся композиция симметрична относительно оси x=20, поэтому
         логотип не смещён вправо. Цвет берётся из --accent темы
         (для фавикона, где темы нет, работает fallback). -->
    <g id="mark" style="color: var(--accent, #a8bd76)">
      <path
        fill="currentColor"
        d="M20 4.5
           C18.6 8.4 14.7 12.3 14.7 15.6
           C14.7 18.7 17.1 21.2 20 21.2
           C22.9 21.2 25.3 18.7 25.3 15.6
           C25.3 12.3 21.4 8.4 20 4.5 Z"
      />
      <g fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round">
        <path d="M12 25.9h16"/>
        <path d="M8.5 32.8h23"/>
      </g>
    </g>
  </defs>
  <use href="#mark"/>
</svg>
