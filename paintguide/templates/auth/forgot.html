{% extends "base.html" %}
{% block content %}
<div class="shell auth-wrap">
  <div class="auth-card">
    <h1>{{ t('account.forgot.title') }}</h1>
    <p>{{ t('account.forgot.lede') }}</p>

    <form method="post" action="{{ url_for('account.forgot_password') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">{{ t('account.email') }}</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <span class="helper">{{ t('account.forgot.hint') }}</span>
      </div>
      <button class="button block" type="submit">{{ t('account.forgot.submit') }}</button>
    </form>

    <p class="auth-switch">
      <a href="{{ url_for('account.login') }}">{{ t('nav.login') }}</a>
    </p>
  </div>
</div>
{% endblock %}
