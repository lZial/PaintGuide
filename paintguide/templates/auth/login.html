{% extends "base.html" %}
{% block content %}
<div class="shell auth-wrap">
  <div class="auth-card">
    <h1>{{ t('account.login.title') }}</h1>
    <p>{{ t('account.login.lede') }}</p>

    {% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('account.login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="field">
        <label for="email">{{ t('account.email') }}</label>
        <input id="email" name="email" type="email" required autocomplete="email" value="{{ email }}">
      </div>
      <div class="field">
        <label for="password">{{ t('account.password') }}</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="button block" type="submit">{{ t('account.submit_login') }}</button>
    </form>

    <p class="auth-switch">
      <a href="{{ url_for('account.forgot_password') }}">{{ t('account.forgot.title') }}</a>
    </p>

    <p class="auth-switch">
      {{ t('account.no_account') }} <a href="{{ url_for('account.register') }}">{{ t('nav.register') }}</a>
    </p>
  </div>
</div>
{% endblock %}
