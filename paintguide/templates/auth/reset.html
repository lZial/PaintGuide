{% extends "base.html" %}
{% block content %}
<div class="shell auth-wrap">
  <div class="auth-card">
    <h1>{{ t('account.reset.title') }}</h1>
    <p>{{ t('account.reset.lede') }}</p>

    {% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('account.reset_password', token=token) }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="password">{{ t('account.reset.new_password') }}</label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password_confirm">{{ t('account.password_confirm') }}</label>
        <input id="password_confirm" name="password_confirm" type="password" minlength="8" required autocomplete="new-password">
      </div>
      <button class="button block" type="submit">{{ t('account.reset.submit') }}</button>
    </form>

    <p class="auth-switch">
      <a href="{{ url_for('account.forgot_password') }}">{{ t('account.forgot.title') }}</a>
    </p>
  </div>
</div>
{% endblock %}
